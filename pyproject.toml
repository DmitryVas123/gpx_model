[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alpha-gpx"
version = "0.0.1"
description = "ALPHA: deterministic analysis of GPX planned routes and recorded activities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gpxpy>=1.6",
    "numpy>=2.0",
    "pyproj>=3.6",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rasterio>=1.3",
]

[project.scripts]
alpha = "alpha.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",  # FastAPI TestClient
]
# Documentation site (mkdocs.yml); never imported by src/alpha.
docs = [
    "mkdocs-material>=9.5,<10",
]
# Exploration scripts only (scripts/); never imported by src/alpha.
explore = [
    "pandas>=2.2",
    "plotly>=5.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette's TestClient announces a future httpx successor; not actionable yet.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# --- ruff ---
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# scripts/ is an exploration sandbox and is not held to package standards.
extend-exclude = ["scripts/explore.py", "*.md"]  # old pandas sandbox

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # naming
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

# --- mypy ---
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
exclude = ['scripts/explore.py$']
strict = true

[[tool.mypy.overrides]]
module = ["gpxpy", "gpxpy.*", "rasterio", "rasterio.*"]
ignore_missing_imports = true
